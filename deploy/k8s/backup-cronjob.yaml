# Daily logical backup (pg_dump, custom format) to a volume, kept for 14 days. This includes the
# evidence files, which live in the database. It stays inside the cluster, so also copy the
# files off-site, or switch to CloudNativePG's Barman Cloud plugin (see postgres.yaml).
# Restore: pg_restore --clean --if-exists -d "$URI" vulcan-<date>.dump
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vulcan-backup
  namespace: vulcan
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vulcan-backup
  namespace: vulcan
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vulcan-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70        # user "postgres" in the alpine image
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  f="/backup/vulcan-$(date -u +%Y%m%d-%H%M).dump"
                  pg_dump --format=custom --file="$f.part" "$URI"
                  mv "$f.part" "$f"
                  find /backup -name 'vulcan-*.dump' -mtime +14 -delete
                  ls -lh /backup
              env:
                - name: URI
                  valueFrom:
                    secretKeyRef:
                      name: vulcan-db-app
                      key: uri
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: vulcan-backup
